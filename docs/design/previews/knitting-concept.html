<style>

in-width:0}.panel.dark{background:var(--dark);color:var(--light)}.panel.dark .muted{color:#acb2a5}.panel.outlined{background:transparent;border:1px solid var(--line)}.panel.hover{transition:transform .16s,box-shadow .16s}.panel.hover:hover{transform:translateY(-2px);box-shadow:0 10px 22px #191b190c}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{padding:18px;border-radius:18px;background:linear-gradient(180deg,var(--paper) 45%,var(--pale));min-width:0}.metric .value{font-size:30px;line-height:1.1;letter-spacing:-1px;margin:12px 0 9px;font-weight:600}.metric .unit{font-size:13px;letter-spacing:0;font-weight:400}.metric .small{color:var(--muted);font-size:11px}.overview-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:18px}.stage{position:relative;overflow:hidden;min-height:270px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:30px;background:linear-gradient(130deg,#f6f6f2,#e5e7df);border:1px solid var(--line)}.stage svg{width:100%;max-height:250px;filter:drop-shadow(0 16px 12px #3c42351c);transition:transform .5s}.stage:hover svg{transform:translateY(-3px) rotate(-2deg)}.stage h2{font-size:37px;margin:12px 0}.stage p{font-size:12px;color:var(--muted);max-width:220px;margin-bottom:20px}.line{height:1px;background:var(--line);margin:20px 0}.dark .line{background:#41463e}.progress{height:5px;border-radius:9px;background:#daddd3;overflow:hidden}.progress span{display:block;height:100%;background:var(--peach);transition:width .22s}.dark .progress{background:#3b4135}.queue-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.queue-row:last-child{border:0;padding-bottom:0}.dark .queue-row{border-color:#3a4035}.queue-row .circle{width:39px;height:39px;border-radius:13px;background:#e5e8df;display:grid;place-items:center;font-size:12px}.dark .queue-row .circle{background:#30362c}.queue-row strong{font-weight:600;font-size:12px}.queue-row p{font-size:11px;color:var(--muted);margin-top:2px}.dark .queue-row p{color:#a3aa9c}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.timeline{display:flex;gap:0;align-items:center;margin-top:20px;flex-wrap:wrap}.step{flex:1;min-width:90px;display:grid;gap:7px;font-size:11px;color:var(--muted);padding-bottom:10px;border-bottom:3px solid #d5d9ce}.step.done{border-color:var(--ink);color:var(--ink)}.step.current{border-color:var(--peach);color:var(--ink)}.step b{font-size:11px}.step .dot{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px}.step.done .dot{background:var(--dark);color:var(--light);border-color:var(--dark)}.step.current .dot{background:var(--pale);border-color:var(--peach)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 18px}.tab{padding:10px 15px;min-height:44px;border-radius:999px;font-size:12px;border:1px solid transparent}.tab.active{background:var(--dark);color:var(--light)}.tab:not(.active):hover{border-color:var(--line)}.tablewrap{overflow-x:auto;border-radius:18px;background:var(--paper)}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:600;color:var(--muted);padding:17px 18px;border-bottom:1px solid var(--line)}td{padding:19px 18px;border-bottom:1px solid #dce0d5}tbody tr:last-child td{border:0}tbody tr:hover{background:#edeFE7}.link{color:var(--ink);text-decoration:underline;text-decoration-color:#a9b1a1;text-underline-offset:4px;min-height:44px;padding:8px 0}.detail-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:18px}.specgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}.specgrid dt{color:var(--muted);font-size:11px;margin-bottom:5px}.specgrid dd{margin:0;font-size:13px}.balance-row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;font-size:12px;border-bottom:1px solid #3a4035}.balance-row:last-child{border:0}.balance-row strong{font-size:15px}.notice{padding:14px 16px;border-radius:14px;background:#f0e7d8;font-size:12px;color:#6b542e;display:flex;align-items:center;gap:10px}.search{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:0;min-height:44px}.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.planner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.machine-head{display:flex;justify-content:space-between;align-items:center}.machine-card{border-radius:16px;padding:18px;background:#e8ebe2;margin-top:16px;border-left:3px solid var(--peach);animation:arrive .18s}.machine-card.dark{background:#30362b;color:var(--light)}.machine-card h3{margin-bottom:8px}.machine-card p{font-size:11px}.slots{display:grid;gap:13px;margin-top:16px;color:var(--muted);font-size:11px}.slot{padding:12px;border:1px dashed var(--line);border-radius:12px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:8px;font-size:12px}.field input,.field select{background:#e9ece2;border:1px solid var(--line);border-radius:13px;min-height:44px;padding:12px;min-width:0;width:100%}.field.wide{grid-column:1/-1}.weight{background:linear-gradient(var(--paper),var(--pale));padding:26px;border-radius:18px;margin:18px 0}.weight input{border:0;background:transparent;font-size:58px;line-height:1;letter-spacing:-2px;width:100%;font-weight:600;padding:10px 0}.qc-card{border-radius:18px;padding:20px;background:#e8ebe3;margin-top:14px;transition:background .18s}.qc-card.released{background:#e4ebe0}.qc-card .big{font-size:36px;font-weight:600;letter-spacing:-1px;margin:14px 0}.qc-card .big small{font-size:13px;letter-spacing:0;font-weight:400}.station-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.amount{font-size:40px;letter-spacing:-1px;margin:14px 0}.summaryline{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:13px 0}.setupcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.checkitem{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:16px 0;font-size:12px}.checkitem:last-child{border:0}.checkmark{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--dark);color:var(--light);flex:none;font-size:11px}.empty{padding:40px;text-align:center;color:var(--muted)}.generic{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.generic img{width:100%;height:145px;object-fit:contain;mix-blend-mode:multiply}.generic h3{margin:12px 0}.generic p{font-size:12px;color:var(--muted);margin-bottom:16px}.footer{margin-top:24px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;background:var(--dark);color:var(--light);padding:14px 22px;border-radius:18px;box-shadow:0 12px 30px #191b1922;max-width:calc(100% - 32px);font-size:12px}#toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:24px;background:var(--paper);color:var(--ink);padding:28px;max-width:min(500px,calc(100% - 32px));box-shadow:0 30px 80px #191b1933}dialog::backdrop{background:#191b1955;backdrop-filter:blur(3px)}dialog p{margin:16px 0 24px;font-size:13px;color:var(--muted)}dialog .eyebrow{margin-bottom:12px;color:var(--muted)}.no-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}.no-motion .stage:hover svg,.no-motion .panel.hover:hover,.no-motion .pill:hover{transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stage:hover svg,.panel.hover:hover,.pill:hover{transform:none}}
@media(min-width:1500px){.overview-grid{grid-template-columns:1.65fr 1fr}.stage{min-height:310px}}
@media(max-width:1100px){.header{padding:0 20px;gap:12px}.layout{padding:22px 20px;grid-template-columns:64px minmax(0,1fr);gap:18px}.rail .nav{padding:12px;justify-content:center}.rail .nav span,.rail .eyebrow,.rail .bottom{display:none}.overview-grid,.detail-grid{grid-template-columns:1fr}.planner{grid-template-columns:1fr 1fr}.planner .panel:last-child{grid-column:1/-1}.context select{max-width:145px}.header .accountlabel{display:none}}
@media(max-width:700px){.header{height:auto;min-height:92px;padding:15px 18px;flex-wrap:wrap;gap:10px}.brand{font-size:18px}.header .divider{display:none}.header .context{order:3;flex-basis:100%;justify-content:space-between}.context select{max-width:180px}.layout{display:block;padding:14px}.rail{display:flex;flex-direction:row;gap:6px;margin-bottom:22px;flex-wrap:wrap}.rail .nav{padding:10px 12px;gap:7px;flex:1;min-width:74px;flex-direction:column;font-size:10px}.rail .nav span{display:block}.rail .nav svg{width:17px;height:17px}.pagehead{margin-bottom:20px}h1{font-size:35px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric{padding:16px}.metric .value{font-size:27px}.stage{grid-template-columns:1fr 1fr;padding:20px;min-height:240px}.stage h2{font-size:30px}.stage p{font-size:11px}.panel{padding:20px}.station-grid,.setupcards,.planner,.generic,.mini-grid{grid-template-columns:1fr}.planner .panel:last-child{grid-column:auto}.specgrid{grid-template-columns:1fr 1fr}.pagehead .pill{padding:10px 15px}.previewbar{padding:10px 16px;font-size:10px}.weight input{font-size:48px}.tabs{gap:3px}.tab{padding:10px 11px}.generic img{height:120px}.header .rolelabel{display:none}.footer{font-size:10px}.fieldgrid{grid-template-columns:1fr}}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-job" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="3"/><path d="M9 3h6v4H9zM9 12h6M9 16h4"/></symbol>
<symbol id="i-plan" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h4m2 3h4"/></symbol>
<symbol id="i-roll" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/></symbol>
<symbol id="i-bill" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6m-6 4h6"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
</defs></svg>
<div class="previewbar"><span><b>DESIGN PREVIEW</b> &nbsp; Sample data · No ERP connection</span><div class="row"><label><input type="checkbox" id="reduce"> Reduce motion</label><button id="reset" style="color:inherit;text-decoration:underline;padding:4px">Reset sample</button></div></div>
<header class="header"><div class="brand">WORKSPACE.</div><div class="divider"></div><div class="context"><select id="company" aria-label="Preview company"><option value="knit">Demo Knitworks</option><option value="general">General ERP demo</option></select><button class="pill" id="workspace" style="min-height:36px;padding:7px 14px">Knitting ↗</button></div><div class="grow"></div><span class="small muted rolelabel">Preview role</span><select id="role" aria-label="Preview user role" class="search" style="background:transparent;border:0;padding:6px"><option>Owner</option><option>Operator</option><option>Accountant</option></select><div class="avatar" aria-hidden="true">DW</div></header>
<div class="layout"><nav class="rail" aria-label="Preview screens" id="nav"></nav><main class="main" id="main"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="review"><div class="eyebrow">Review action · sample only</div><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="row" style="justify-content:flex-end"><button class="pill outline" id="cancel">Go back</button><button class="pill" id="confirm">Confirm in preview</button></div></dialog>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let screen='overview',jobTab='programme',roll2Released=false,delivered=false,invoiced=false,planMachine='M01',draftMachine='M01',pending=null,toastTimer;
const icon=name=>`<svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const pages=[['overview','grid','Overview'],['jobs','job','Jobs'],['planner','plan','Planning'],['production','roll','Production / QC'],['billing','bill','Delivery / billing'],['setup','settings','Industry setup']];
const allowed=()=>{const r=$('role').value;return pages.filter(p=>r==='Owner'||r==='Operator'&&!['billing','setup'].includes(p[0])||r==='Accountant'&&['overview','jobs','billing'].includes(p[0]));};
const pill=(text,action,cls='')=>`<button class="pill ${cls}" data-action="${action}">${text}</button>`;
const badge=(text,cls='')=>`<span class="badge ${cls}">${text}</span>`;
function toast(text){$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',4500);}
function review(title,text,fn){$('dialogTitle').textContent=title;$('dialogText').textContent=text;pending=fn;$('review').showModal();}
function title(kicker,heading,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${heading}</h1><p>${desc}</p></div>${action}</div>`;}
function footer(){return '<div class="footer"><span>'+($('company').value==='general'?'General ERP demo · Industry pack not enabled':'Demo Knitworks · Synthetic scenario KN-DEMO-001')+'</span><span>Concept preview · Native Flutter implementation is pending</span></div>';}
function metric(label,value,unit,context){return `<div class="metric"><span class="small">${label}</span><div class="value num">${value} <span class="unit">${unit}</span></div><span class="small">${context}</span></div>`;}
function spool(){return `<svg viewBox="0 0 320 270" role="img" aria-label="Original illustrative white yarn spool"><defs><linearGradient id="thread" x1="0" x2="1"><stop stop-color="#d7dbd0"/><stop offset=".32" stop-color="#fffefa"/><stop offset=".7" stop-color="#f4f4ed"/><stop offset="1" stop-color="#c8cec1"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#d5dacd"/></linearGradient><pattern id="lines" width="2" height="5" patternUnits="userSpaceOnUse"><path d="M0 1h240" stroke="#bac2b0" stroke-opacity=".23"/></pattern></defs><ellipse cx="170" cy="236" rx="100" ry="14" fill="#c7cdbe" opacity=".45"/><path d="M79 80h177l-12 136c-4 28-151 26-154 0Z" fill="url(#thread)"/><ellipse cx="167" cy="82" rx="89" ry="35" fill="url(#top)"/><ellipse cx="167" cy="78" rx="27" ry="11" fill="#b6beaa"/><ellipse cx="167" cy="75" rx="20" ry="7" fill="#7c886d"/><path d="M86 97q78 28 163 0l-6 116c-3 24-148 24-151 0Z" fill="url(#lines)"/><path d="M92 203q17 23 68 23c28 0 45-12 57-21" stroke="#e0bda2" fill="none" stroke-width="3"/><path d="M217 205q29-5 45 10c24 21-5 34-22 28" stroke="#d5a689" fill="none" stroke-width="3"/></svg>`;}
function queue(letter,name,detail,end){return `<div class="queue-row"><div class="circle">${letter}</div><div class="grow"><strong>${name}</strong><p>${detail}</p></div>${end}</div>`;}
function overview(){return title('Knitting workspace / Today','KNITTING OVERVIEW','Know what needs attention. Move each job forward.',pill('Open active job ↗','job'))+`<div class="metrics">${metric('Programme','88.000','kg','KN-DEMO-001')}${metric('Produced','88.000','kg','2 traceable rolls')}${metric('Ready for delivery',delivered?(roll2Released?'44.000':'0.000'):roll2Released?'88.000':'44.000','kg',roll2Released?'QC release recorded':'1 roll on QC hold')}${metric('Billed',invoiced?'4,400':'0','INR','From confirmed deliveries')}</div><div class="overview-grid"><div class="stack"><section class="panel stage"><div><div class="eyebrow">Material to finished fabric</div><h2>EVERY ROLL.<br>ONE CLEAR STORY.</h2><p>Yarn, machines, quality and billing, connected to the same job.</p>${pill('Explore this job','job')}</div>${spool()}</section><section class="panel hover"><div class="row between"><h2>ACTIVE JOB</h2>${badge('Running')}</div><div class="row between" style="margin-top:18px"><div><b>KN-DEMO-001</b><p class="small muted">Demo Customer · Single jersey · 24 GG</p></div><div class="num">88.000 / 88.000 kg</div></div><div class="progress" style="margin-top:18px"><span style="width:100%"></span></div><div class="row between" style="margin-top:14px"><span class="small muted">Production complete · ${delivered?'44.000 kg delivered':'Awaiting first delivery'}</span><button class="link" data-action="job">View timeline ↗</button></div></section></div><div class="stack"><section class="panel dark"><div class="row between"><h2>NEXT UP</h2>${badge('Shift A','dark')}</div>${queue('01','Quality queue',roll2Released?'All rolls released':'Roll R-002 needs a decision',`<button class="round" data-action="production" aria-label="Open quality queue">${icon('arrow')}</button>`)}${queue('02','Machine queue',`Job allocated to ${planMachine}`,`<button class="round" data-action="planner" aria-label="Open machine planner">${icon('arrow')}</button>`)}${queue('03','Delivery and billing',invoiced?'First invoice posted in preview':delivered?'44.000 kg ready to invoice':'Release → delivery → invoice',`<button class="round" data-action="billing" aria-label="Open delivery and billing">${icon('arrow')}</button>`)}</section><section class="panel outlined"><div class="eyebrow muted">Yarn reconciliation</div><div class="amount num">100.000 <small style="font-size:14px;letter-spacing:0">kg received</small></div><div class="summaryline"><span>Consumed</span><b>90.000 kg</b></div><div class="summaryline"><span>Remaining yarn</span><b>10.000 kg</b></div><div class="summaryline"><span>Declared process loss</span><b>2.000 kg</b></div><p class="small muted">Customer-owned material · custody tracked separately</p></section></div></div>`;}
function timeline(){return `<div class="timeline">${[['Job',true],['Yarn',true],['Production',true],['QC',roll2Released],['Delivery',delivered],['Invoice',invoiced]].map(([n,done],i)=>`<div class="step ${done?'done':i===3&&!roll2Released||i===4&&roll2Released&&!delivered||i===5&&delivered&&!invoiced?'current':''}"><span class="dot">${done?'✓':i+1}</span><b>${n}</b></div>`).join('')}</div>`;}
function job(){const tabs=['programme','material','rolls','billing'];return title('Knitting / Jobs / KN-DEMO-001','JOB KN-DEMO-001','Demo Customer · Order · Customer-owned yarn',pill('Open production / QC','production'))+`<section class="panel"><div class="row between"><div class="row"><h2>KN-DEMO-001</h2>${badge('Running')}</div><span class="small muted">Due 18 Nov · Demo shift plan</span></div>${timeline()}</section><div class="tabs" role="tablist" aria-label="Job details">${tabs.map(t=>`<button role="tab" aria-selected="${t===jobTab}" class="tab ${t===jobTab?'active':''}" data-action="tab-${t}">${{programme:'Programme',material:'Yarn balance',rolls:'Rolls and QC',billing:'Delivery and billing'}[t]}</button>`).join('')}</div><div class="detail-grid"><section class="panel">${jobTab==='programme'?`<div class="row between"><h2>FABRIC PROGRAMME</h2>${badge('Revision 1')}</div><dl class="specgrid"><div><dt>Fabric</dt><dd>Single jersey</dd></div><div><dt>Colour</dt><dd>Natural</dd></div><div><dt>GSM</dt><dd>180</dd></div><div><dt>Fabric dia</dt><dd>30 in</dd></div><div><dt>Gauge</dt><dd>24 GG</dd></div><div><dt>Knit type</dt><dd>Tubular</dd></div><div><dt>Programme</dt><dd>88.000 kg</dd></div><div><dt>Produced</dt><dd>2 rolls · 88.000 kg</dd></div><div><dt>Service rate</dt><dd>INR 100.00 / kg</dd></div></dl><div class="line"></div><p class="small muted">Order / Sample, material ownership, operational completion and billing state remain separate.</p>`:jobTab==='material'?`<h2>MATERIAL TRACEABILITY</h2>${queue('↘','Yarn inward','LOT-DEMO · 100.000 kg',badge('Confirmed','good'))}${queue('→','Production consumption','90.000 kg → fabric 88.000 + loss 2.000',badge('Posted','good'))}${queue('○','Remaining customer yarn','10.000 kg · return before closure',badge('In custody','hold'))}`:jobTab==='rolls'?`<h2>TWO ROLLS. FULL HISTORY.</h2>${rollRows()}${pill('Open quality station','production','outline')}`:`<h2>DELIVERY TO RECEIVABLE</h2>${queue('DC','Fabric delivery',delivered?'44.000 kg · R-001':'No delivery yet',badge(delivered?'Confirmed':'Pending',delivered?'good':''))}${queue('SI','Service invoice',invoiced?'INR 4,400.00 · 44.000 kg':'No posted invoice',badge(invoiced?'Posted':'Pending',invoiced?'good':''))}${pill('Open delivery and billing','billing','outline')}`}</section><aside class="panel dark"><div class="eyebrow">Job balance · sample scenario</div><h2 style="margin-top:10px">NOTHING LOST<br>BETWEEN SCREENS.</h2><div class="line"></div><div class="balance-row"><span>Yarn received</span><strong class="num">100.000 kg</strong></div><div class="balance-row"><span>Yarn remaining</span><strong class="num">10.000 kg</strong></div><div class="balance-row"><span>Fabric produced</span><strong class="num">88.000 kg</strong></div><div class="balance-row"><span>Fabric delivered</span><strong class="num">${delivered?'44.000':'0.000'} kg</strong></div><div class="balance-row"><span>Fabric billed</span><strong class="num">${invoiced?'44.000':'0.000'} kg</strong></div><p class="small muted" style="margin-top:20px">Sample values for design review. Real balances will be computed and validated on our server.</p></aside></div>`;}
function rollRows(){return queue('R1','R-001 · 44.000 kg','M01 · Operator Demo · Shift A',badge('Released','good'))+queue('R2','R-002 · 44.000 kg','M01 · Operator Demo · Shift A',badge(roll2Released?'Released':'On hold',roll2Released?'good':'hold'));}
function jobs(){return title('Knitting / Workbench','JOBS AND PROGRAMMES','Prioritise the next action without losing the details.',pill('Open sample job','job'))+`<div class="filters"><input id="jobSearch" class="search grow" aria-label="Search sample jobs" placeholder="Search job or customer"><select class="search" id="statusFilter" aria-label="Job status filter"><option>Running</option><option>Completed</option></select>${pill('Reset filters','resetfilters','outline')}</div><div class="tablewrap"><table><thead><tr><th>Job / customer</th><th>Programme</th><th>Production</th><th>Quality</th><th>Next action</th></tr></thead><tbody id="jobRows">${jobTableRow()}</tbody></table></div>`;}
function jobTableRow(){return `<tr><td><button class="link" data-action="job"><b>KN-DEMO-001</b></button><br><span class="muted">Demo Customer</span></td><td class="num">88.000 kg<br><span class="muted small">Single jersey · 24 GG</span></td><td class="num">88.000 kg<div class="progress" style="width:120px;margin-top:8px"><span style="width:100%"></span></div></td><td>${badge(roll2Released?'All released':'1 roll on hold',roll2Released?'good':'hold')}</td><td>${pill(roll2Released?'Prepare delivery':'Review QC',roll2Released?'billing':'production','outline')}</td></tr>`;}
function planner(){return title('Knitting / Machine planner','MACHINE PLANNING','Review machine capability, shift capacity and queue changes.',pill('Review plan changes','applyplan'))+`<div class="notice">Sample queue · ${draftMachine!==planMachine?'1 unapplied change — the saved plan is still '+planMachine:'No unapplied changes'} · Day / shift view</div><div class="planner" style="margin-top:18px">${['M01','M02','M03'].map((m,i)=>`<section class="panel ${i===2?'dark':''}"><div class="machine-head"><h2>${m}</h2>${badge(i===2?'Maintenance':'Available',i===2?'dark':'good')}</div><p class="small muted" style="margin-top:8px">${i===2?'Needle change · Shift A':'30 in · 24 GG · Tubular'}</p>${draftMachine===m?`<div class="machine-card"><div class="eyebrow">Shift A · 08:00–16:00</div><h3>KN-DEMO-001</h3><p>88.000 kg · Single jersey<br>Demo Customer</p><div class="progress" style="margin:14px 0"><span style="width:73%"></span></div><p>73% of 120 kg shift capacity</p><div style="margin-top:15px">${pill('Move to '+(m==='M01'?'M02':'M01'),'moveplan','light')}</div></div>`:`<div class="slots"><div class="slot">${i===2?'Unavailable · maintenance window':'Shift A · capacity 120 kg'}</div><div class="slot">${i===2?'Return to service needs confirmation':'Shift B · no allocation'}</div></div>`}</section>`).join('')}</div><section class="panel outlined" style="margin-top:18px"><div class="row between"><div><h2>BEFORE YOU APPLY</h2><p class="small muted" style="margin-top:8px">Compatibility, overlap, remaining programme and version must pass together.</p></div>${badge('Review before save')}</div></section>`;}
function production(){return title('Knitting / Production and quality','PRODUCTION AND QC','A focused station view for operators and checkers.',pill('View connected job','job','outline'))+`<div class="station-grid"><section class="panel"><div class="row between"><h2>ROLL PRODUCTION</h2>${badge('Sample entry')}</div><div class="fieldgrid" style="margin-top:22px"><label class="field">Machine<select aria-label="Production machine"><option>${planMachine} · 30 in / 24 GG</option></select></label><label class="field">Shift<select aria-label="Production shift"><option>Shift A · 08:00–16:00</option></select></label><label class="field wide">Programme<select><option>KN-DEMO-001 · Single jersey</option></select></label></div><label class="weight field">Actual roll weight<input id="weight" inputmode="decimal" value="44.000" aria-label="Sample roll weight in kilograms"><span class="small muted">kg · Three decimal places</span></label><div class="notice">The sample programme is already fully produced. Another roll is blocked.</div><div class="row between" style="margin-top:18px"><span class="small muted">Programme remaining <b>0.000 kg</b></span>${pill('Review production','reviewproduction')}</div></section><section class="panel dark"><div class="row between"><h2>TOUCH QC</h2>${badge(roll2Released?'0 awaiting':'1 needs review','dark')}</div><p class="small muted" style="margin-top:9px">Machine M01 · Checker Demo · KN-DEMO-001</p><div class="qc-card released" style="color:var(--ink)"><div class="row between"><strong>R-001</strong>${badge('Released','good')}</div><div class="big num">44.000 <small>kg</small></div><span class="small muted">Inspection 1 · No defect recorded</span></div><div class="qc-card ${roll2Released?'released':''}" style="color:var(--ink)"><div class="row between"><strong>R-002</strong>${badge(roll2Released?'Released':'On hold',roll2Released?'good':'hold')}</div><div class="big num">44.000 <small>kg</small></div><p class="small muted">${roll2Released?'Inspection 2 · Released after review. Earlier Hold retained.':'Inspection 1 · Fabric check needs review'}</p><div style="margin-top:16px">${pill(roll2Released?'View inspection history':'Review and release',roll2Released?'qchistory':'release','light')}</div></div></section></div>`;}
function billing(){return title('Knitting / Delivery and billing','DELIVERY AND INVOICING','One source of quantity. Clear commercial documents.',pill('View job balance','job','outline'))+`<div class="detail-grid"><div class="stack"><section class="panel"><div class="row between"><h2>FABRIC DELIVERY</h2>${badge(delivered?'Confirmed':'Ready to prepare',delivered?'good':'')}</div><div class="queue-row"><input type="checkbox" checked disabled aria-label="First roll selected"><div class="grow"><b>R-001</b><p>KN-DEMO-001 · 30 in · Released</p></div><b class="num">44.000 kg</b></div><div class="queue-row"><div class="circle">R2</div><div class="grow"><b>R-002</b><p>${roll2Released?'Released · available for a later delivery':'On hold · cannot be delivered'}</p></div><b class="num">44.000 kg</b></div><div class="row between" style="margin-top:20px"><span class="small muted">First partial delivery · 1 roll</span>${pill(delivered?'View delivery reference':'Review delivery',delivered?'deliveryref':'deliver')}</div></section><section class="panel outlined"><h2>QUANTITY THAT EXPLAINS ITSELF.</h2><div class="summaryline"><span>Programme produced</span><b>88.000 kg</b></div><div class="summaryline"><span>Confirmed delivery</span><b>${delivered?'44.000':'0.000'} kg</b></div><div class="summaryline"><span>Already invoiced</span><b>${invoiced?'44.000':'0.000'} kg</b></div><div class="summaryline"><span>Available to invoice</span><b>${delivered&&!invoiced?'44.000':'0.000'} kg</b></div><p class="small muted">Customer material is charged as a knitting service, without selling the customer's yarn.</p></section></div><aside class="panel dark"><div class="eyebrow">Service invoice · INR</div><h2 style="margin-top:12px">REVIEW THE<br>FINAL NUMBERS.</h2><div class="line"></div><div class="summaryline"><span>Quantity</span><b>44.000 kg</b></div><div class="summaryline"><span>Rate</span><b>100.00 / kg</b></div><div class="summaryline"><span>Tax</span><b>0.00 · test fixture</b></div><div class="line"></div><p class="small muted">Invoice total</p><div class="amount num">₹4,400.00</div><div class="row">${badge(invoiced?'Posted in preview':delivered?'Ready for review':'Waiting for delivery','dark')}</div><div style="margin-top:26px">${pill(invoiced?'View posting receipt':'Review invoice',invoiced?'invoiceref':'invoice','light')}</div><p class="small muted" style="margin-top:20px">The real app will use ERPNext's server calculations and General Ledger. This preview records local sample state only.</p></aside></div>`;}
function setup(){return title('Workspace / Business setup','INDUSTRY SETUP','General ERP stays the foundation. Add the workflows your business needs.',badge('Demo setup'))+`<div class="setupcards"><section class="panel dark"><div class="row between"><h2>GENERAL ERP</h2>${badge('Foundation','dark')}</div><p class="small muted" style="margin:20px 0">Accounts · Selling · Buying · Stock · Manufacturing · Projects · Assets · Quality</p><div class="line"></div><h3>SHARED BY EVERY INDUSTRY.</h3><p class="small muted" style="margin-top:12px">One set of accounts, users, documents and controls. The knitting pack adds industry tasks to this product.</p></section><section class="panel"><div class="row between"><h2>KNITTING PACK</h2>${badge('Active','good')}</div><div class="checkitem"><span class="checkmark">✓</span><span>Company and godown scope</span></div><div class="checkitem"><span class="checkmark">✓</span><span>Machines, shifts, operators and checkers</span></div><div class="checkitem"><span class="checkmark">✓</span><span>Ownership, precision and numbering</span></div><div class="checkitem"><span class="checkmark">✓</span><span>Roles and action permissions</span></div><div style="margin-top:18px">${pill('Try General ERP business','general','outline')}</div></section></div><section class="panel outlined" style="margin-top:18px"><h2>THE RIGHT WORK, FOR THE RIGHT PERSON.</h2><div class="tablewrap" style="margin-top:18px"><table><thead><tr><th>Preview role</th><th>Daily focus</th><th>Access boundary</th></tr></thead><tbody><tr><td>Owner</td><td>Jobs, planning, balances and setup</td><td>Company and action permissions still apply</td></tr><tr><td>Operator</td><td>Assigned jobs, production and QC</td><td>Invoice and setup hidden in this role preview</td></tr><tr><td>Accountant</td><td>Delivery, billing and financial records</td><td>Cannot change machine plans through this role preview</td></tr></tbody></table></div><p class="small muted" style="margin-top:16px">Use the Preview role control above. Server-enforced permissions belong to the implementation, not this mockup.</p></section>`;}
function general(){return title('General ERP / Business overview','BUSINESS OVERVIEW','Core ERP features remain available without any industry pack.',badge('General ERP demo'))+`<div class="generic">${[['warehouse','Stock','Items, warehouses and movements'],['sales','Selling','Orders, invoices and customers'],['purchasing','Buying','Suppliers, receipts and purchases']].map(([image,name,desc])=>`<section class="panel hover"><img src="../../../apps/erp_client/assets/images/${image}.png" alt="Original white 3D ${name.toLowerCase()} illustration"><h3>${name.toUpperCase()}</h3><p>${desc}</p>${pill('Preview core record','core-'+name.toLowerCase(),'outline')}</section>`).join('')}</div><section class="panel dark" style="margin-top:18px"><div class="row between"><div><div class="eyebrow">Optional industry workspaces</div><h2 style="margin-top:10px">THE FOUNDATION STAYS YOURS.</h2><p class="small muted" style="margin-top:12px">This company has no knitting pack enabled. Switch back to Demo Knitworks to see its extra workflows.</p></div>${pill('Switch to knitting demo','knit','light')}</div></section>`;}
function render(){const isGeneral=$('company').value==='general';if(!isGeneral&&!allowed().some(p=>p[0]===(screen==='job'?'jobs':screen)))screen='overview';$('workspace').textContent=isGeneral?'General ERP ↗':'Knitting ↗';$('nav').innerHTML=isGeneral?'<div class="eyebrow">General ERP</div>'+['Overview','Accounts','Selling','Buying','Stock'].map((n,i)=>`<button class="nav ${i===0?'active':''}" aria-label="${n}" data-action="${i===0?'general':'core-'+n.toLowerCase()}">${icon(i===0?'grid':'bill')}<span>${n}</span></button>`).join(''):'<div class="eyebrow">Knitting</div>'+allowed().map(([id,ic,label])=>`<button class="nav ${(screen===id||screen==='job'&&id==='jobs')?'active':''}" aria-label="${label}" aria-current="${screen===id?'page':'false'}" data-action="${id}">${icon(ic)}<span>${label}</span></button>`).join('')+'<div class="bottom"><div class="eyebrow" style="margin:0">Your shared ERP</div><p>Accounts, stock and the rest of your workspace stay connected.</p><button class="link" data-action="general">Explore General ERP ↗</button></div>';
const content=isGeneral?general():({overview,jobs,job,planner,production,billing,setup}[screen]||overview)();$('main').innerHTML=`<div class="page">${content}${footer()}</div>`;}
function navigate(to){if(to==='job'){screen='job';}else{screen=to;}render();}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
if(a.startsWith('tab-')){jobTab=a.slice(4);render();return;}
if(a==='general'||a==='knit'){$('company').value=a==='general'?'general':'knit';screen='overview';render();return;}
if(a.startsWith('core-')){review('A consistent core record workspace','Core '+a.slice(5)+' records will use the same header, section cards, fields, review actions and activity treatment as the knitting screens. This preview focuses on the new industry workflow.',()=>toast('Core UI consistency is included in stage 1, before the knitting cycle.'));return;}
if(a==='moveplan'){draftMachine=draftMachine==='M01'?'M02':'M01';render();toast('Local plan change. Review and Apply before changing the saved queue.');return;}
if(a==='applyplan'){review('Apply machine allocation?',`KN-DEMO-001 · 88.000 kg · ${draftMachine} · Shift A. The real server must check capacity, overlap and source version together.`,()=>{planMachine=draftMachine;render();toast('Sample plan confirmed on '+planMachine);});return;}
if(a==='release'){review('Release R-002 after inspection?','44.000 kg · Checker Demo. Add a second inspection and preserve the earlier Hold decision.',()=>{roll2Released=true;render();toast('R-002 released in the sample. Delivery eligibility updated.');});return;}
if(a==='qchistory'){review('R-002 inspection history','Inspection 1: Hold — fabric check. Inspection 2: Released after review. The real product retains actor, time, reason and version.',()=>toast('History remains attached to the same immutable roll.'));return;}
if(a==='reviewproduction'){toast('Production blocked: programme remaining is 0.000 kg. The two sample rolls already fulfil this job.');return;}
if(a==='deliver'){review('Confirm first partial delivery?','R-001 · 44.000 kg · Demo Customer. One released roll becomes delivered; the remaining roll stays in stock.',()=>{delivered=true;render();toast('Sample DC-DEMO-001 confirmed. 44.000 kg now available to invoice.');});return;}
if(a==='invoice'){if(!delivered){toast('Confirm the source delivery before invoicing.');return;}review('Post service invoice?','44.000 kg × INR 100.00/kg = INR 4,400.00. Zero tax is a synthetic test fixture. No customer-owned yarn is sold.',()=>{invoiced=true;render();toast('Sample SI-DEMO-001 posted locally. Job billed quantity updated.');});return;}
if(a==='deliveryref'||a==='invoiceref'){review(a==='deliveryref'?'DC-DEMO-001':'SI-DEMO-001',a==='deliveryref'?'Confirmed sample delivery · R-001 · 44.000 kg · KN-DEMO-001.':'Sample service invoice · 44.000 kg · INR 4,400.00. Real stock/GL verification will be recorded during Flutter implementation.',()=>toast('Source link: KN-DEMO-001 → R-001 → DC-DEMO-001'+(a==='invoiceref'?' → SI-DEMO-001':'')));return;}
if(a==='resetfilters'){$('jobSearch').value='';$('statusFilter').value='Running';filterJobs();return;}
if(['overview','jobs','job','planner','production','billing','setup'].includes(a)){if(['billing','setup'].includes(a)&&!allowed().some(p=>p[0]===a)){toast('This preview role does not have that workspace. Change Preview role to Owner.');return;}navigate(a);}
});
function filterJobs(){const match=$('statusFilter').value==='Running'&&'kn-demo-001 demo customer single jersey'.includes($('jobSearch').value.toLowerCase().trim());$('jobRows').innerHTML=match?jobTableRow():'<tr><td colspan="5" class="empty">No jobs match these filters.</td></tr>';}
document.addEventListener('input',event=>{if(event.target.id==='jobSearch')filterJobs();});document.addEventListener('change',event=>{if(event.target.id==='statusFilter')filterJobs();});
$('cancel').onclick=()=>$('review').close();$('confirm').onclick=()=>{const fn=pending;pending=null;$('review').close();if(fn)fn();};$('reduce').onchange=()=>document.body.classList.toggle('no-motion',$('reduce').checked);$('company').onchange=()=>{screen='overview';render();};$('role').onchange=()=>{screen='overview';render();toast('Role preview changed. Product access will be enforced by the server.');};$('workspace').onclick=()=>{if($('company').value==='general'){$('company').value='knit';screen='overview';}else screen='setup';render();};$('reset').onclick=()=>{roll2Released=delivered=invoiced=false;planMachine=draftMachine='M01';jobTab='programme';screen='overview';$('company').value='knit';$('role').value='Owner';render();toast('Synthetic scenario reset.');};render();
})();
</script>
</body>
</html>
