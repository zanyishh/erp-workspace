# Local native-test HTTP contract. Frappe v16 ping accepts these five methods;
# TRACE is rejected by nginx before Frappe can provide an Allow response header.
# Keep other endpoints' method policies under their own handlers.
map "$status:$uri" $native_ping_allow {
    default "";
    "405:/api/method/ping" "GET, POST, PUT, DELETE, OPTIONS";
}

# Frappe's RPC method guard otherwise reports unsupported verbs as 403. Reject
# those at this public endpoint without changing authentication on other APIs.
map "$uri:$request_method" $native_ping_unsupported {
    default 0;
    ~^/api/method/ping:(GET|POST|PUT|DELETE|OPTIONS)$ 0;
    ~^/api/method/ping: 1;
}
