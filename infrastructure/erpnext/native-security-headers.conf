# Local change, 16 November 2026: preserve error headers and supply ping's Allow.
if ($native_ping_unsupported) { return 405; }
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
add_header Allow $native_ping_allow always;
