# Only pure offline script tests belong here. Real Frappe integration uses its container.
[tox]
env_list = py313
skipsdist = true

[testenv]
package = skip
changedir = {toxinidir}/../../..
setenv =
    PYTHONPATH = {toxinidir}/../../../apps/erp_extensions
commands =
    python -m unittest discover -s scripts -p test_*.py -v
    python -m unittest discover -s scripts/migration -p test_*.py -v

# Add another environment only when its interpreter and supported runtime are defined.
